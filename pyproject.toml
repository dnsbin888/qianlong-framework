[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-framework"
version = "1.0.0"
description = "Professional quantitative trading strategy framework — platform-agnostic, event-driven & polling dual-mode"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Quant Trader", email = "trader@example.com"}
]
keywords = ["quantitative", "trading", "strategy", "backtest", "risk-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pandas-ta>=0.3",
    "structlog>=23.0",
    "pyyaml>=6.0",
    "aiohttp>=3.8",
    "sqlalchemy>=2.0",
    "matplotlib>=3.7",
    "rich>=13.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
    "pre-commit>=3.0",
]
parquet = ["pyarrow>=12.0"]
talib = ["talib-binary>=0.4"]
redis = ["redis>=4.5"]

[project.scripts]
quant-run = "quant_framework.cli:run_live"
quant-backtest = "quant_framework.cli:run_backtest"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
